<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact MKLIO</title><meta name="description" content="Contact MKLIO with feedback, questions or tool suggestions."><link rel="canonical" href="https://mk-pedia.netlify.app/contact.html"><link rel="stylesheet" href="/styles.css"><link rel="icon" href="/assets/logo.png"></head><body><div class="topbar"><header class="wrap header"><a href="/"><img class="logo" src="/assets/logo.png" alt="MKLIO"></a><nav class="nav"><a href="/#tools">All tools</a><a href="/about.html">About</a></nav></header></div><main class="wrap tool-shell"><span class="pill">CONTACT</span><h1>Get in touch</h1><section class="tool-panel"><p>We welcome feedback, bug reports and suggestions for useful tools.</p><div class="field"><label for="name">Your name</label><input id="name" autocomplete="name"></div><div class="field"><label for="email">Your email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label for="message">Message</label><textarea id="message"></textarea></div><button type="button" onclick="const n=document.getElementById('name').value,e=document.getElementById('email').value,m=document.getElementById('message').value;if(!e||!m){alert('Please enter your email and message.');return}location.href='mailto:hello@mklio.com?subject='+encodeURIComponent('MKLIO website feedback')+'&body='+encodeURIComponent('Name: '+n+'\nEmail: '+e+'\n\n'+m)">Open email app</button><p class="hint">This opens your device's email application. Replace hello@mklio.com with your chosen support email before publishing.</p></section></main><footer class="site-footer"><div class="wrap footer-row"><strong>MKLIO</strong><div class="footer-links"><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="/">Home</a></div></div></footer></body></html>
